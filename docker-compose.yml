version: "3.8"

services:
  invoiceplane:
    image: funktionslust/invoiceplane:1.6.5
    ports:
      - "8080:80"
    environment:
      IP_URL: http://localhost:8080
      DB_HOSTNAME: db
      DB_USERNAME: invoiceplane
      DB_PASSWORD: invoiceplane
      DB_DATABASE: invoiceplane
      DB_PORT: "3306"
      TZ: UTC
      DEFAULT_LANGUAGE: english
      DEFAULT_ADMIN_EMAIL: admin@localhost
      CI_ENV: production
    volumes:
      - invoiceplane-uploads:/var/www/html/uploads
      - invoiceplane-storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  db:
    image: mariadb:lts
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: invoiceplane
      MYSQL_USER: invoiceplane
      MYSQL_PASSWORD: invoiceplane
    volumes:
      - invoiceplane-db:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  invoiceplane-uploads:
  invoiceplane-storage:
  invoiceplane-db:
